<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="content">
        <div class="display">

        </div>

        <dialog>
            <form action="#" method="get" class="newBookForm" id="newBookForm">
                <div class="title">
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="titleInput" required>
                </div>
                <div class="author">
                    <label for="author">Author:</label>
                    <input type="text" id="author" name="authorInput" required>
                </div>
                <div class="pages">
                    <label for="pages">Pages read:</label>
                    <input type="number" id="pages" name="pagesInput" required>
                </div>
                <div class="read">
                    <label for="read">Read or Not:</label>
                    <input type="checkbox" id="read" name="readInput">
                </div>

                <button class="submit" type="submit">Add book</button>
            </form>
            <button id="dialog-close" autofocus>Close</button>
        </dialog>
        
        <button class="newBookBtn">Add New Book</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
